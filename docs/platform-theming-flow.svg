<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title description">
  <title id="title">Roveliese Telegram theme pipeline</title>
  <desc id="description">Palette and semantic roles flow through platform templates and the generator to four Telegram release formats.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop stop-color="#1a1722"/>
      <stop offset="1" stop-color="#12131c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#c98094"/>
      <stop offset="1" stop-color="#f5e0dc"/>
    </linearGradient>
  </defs>
  <rect width="960" height="260" rx="20" fill="#0f1018"/>
  <text x="42" y="48" fill="#f5e0dc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="700">Roveliese theme pipeline</text>
  <text x="42" y="74" fill="#9da6c5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">One semantic palette, adapted to each native Telegram format.</text>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <rect x="42" y="112" width="156" height="94" rx="14" fill="url(#panel)" stroke="#45475a"/>
    <circle cx="70" cy="143" r="10" fill="#c98094"/>
    <circle cx="88" cy="143" r="10" fill="#79b3ef"/>
    <circle cx="106" cy="143" r="10" fill="#8fb368"/>
    <text x="62" y="179" fill="#edf0fa" font-size="15" font-weight="700">Palette &amp; roles</text>
    <text x="62" y="195" fill="#9da6c5" font-size="11">meaning before tokens</text>

    <path d="M216 159H282" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M276 153l12 6-12 6" fill="#f5e0dc"/>

    <rect x="300" y="112" width="156" height="94" rx="14" fill="url(#panel)" stroke="#45475a"/>
    <path d="M326 137h18M326 145h42M326 153h32" stroke="#79b3ef" stroke-width="3" stroke-linecap="round"/>
    <text x="326" y="179" fill="#edf0fa" font-size="15" font-weight="700">Base templates</text>
    <text x="326" y="195" fill="#9da6c5" font-size="11">real client token names</text>

    <path d="M474 159H540" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M534 153l12 6-12 6" fill="#f5e0dc"/>

    <rect x="558" y="112" width="156" height="94" rx="14" fill="url(#panel)" stroke="#45475a"/>
    <path d="M584 135h24v28h-24zM590 143h12M590 151h12" fill="none" stroke="#c98094" stroke-width="3" stroke-linejoin="round"/>
    <text x="584" y="179" fill="#edf0fa" font-size="15" font-weight="700">Generator</text>
    <text x="584" y="195" fill="#9da6c5" font-size="11">render, validate, package</text>

    <path d="M732 159H758" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M752 153l12 6-12 6" fill="#f5e0dc"/>

    <rect x="776" y="96" width="142" height="126" rx="14" fill="url(#panel)" stroke="#45475a"/>
    <text x="798" y="124" fill="#edf0fa" font-size="14" font-weight="700">Release outputs</text>
    <text x="798" y="149" fill="#f5e0dc" font-size="12">Desktop</text>
    <text x="856" y="149" fill="#9da6c5" font-size="11">.tdesktop-theme</text>
    <text x="798" y="169" fill="#79b3ef" font-size="12">Android</text>
    <text x="856" y="169" fill="#9da6c5" font-size="11">.attheme</text>
    <text x="798" y="189" fill="#c98094" font-size="12">iOS</text>
    <text x="856" y="189" fill="#9da6c5" font-size="11">.tgios-theme</text>
    <text x="798" y="209" fill="#8fb368" font-size="12">macOS</text>
    <text x="856" y="209" fill="#9da6c5" font-size="11">.palette</text>
  </g>
</svg>
